; ESP32-S3 elderly fall monitoring firmware
; Build: pio run
; Upload: pio run -t upload --upload-port COMx
; Monitor: pio device monitor --port COMx

; Build outside the Chinese source path; Xtensa ld cannot write firmware.map
; when the project directory contains non-ASCII characters.
[platformio]
build_dir = ${sysenv.TEMP}/AIoT_Fall_PIO_Build

[env:esp32-s3-devkitc-1]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
build_type = release
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
extra_scripts = post:merge_firmware.py

lib_deps =
	electroniccats/MPU6050@^1.4.3
	bblanchon/ArduinoJson@^7.3.1

build_flags =
	-DSPIFFS_USE_MAGIC
	-DSPIFFS_USE_MAGIC_LENGTH
	-DCONFIG_ARDUHAL_LOG_COLORS=1
